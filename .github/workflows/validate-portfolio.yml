name: Validar portfólio MARQA
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/build_portfolio.py'
      - 'netlify.toml'
      - '.github/workflows/validate-portfolio.yml'
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - 'tools/build_portfolio.py'
      - 'netlify.toml'
      - '.github/workflows/validate-portfolio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Montar e validar o site completo
        run: python3 tools/build_portfolio.py
      - name: Empacotar versão para auditoria
        uses: actions/upload-artifact@v4
        with:
          name: marqa-portfolio-publicavel
          path: dist/site
          retention-days: 7
